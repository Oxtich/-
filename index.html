<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>УВД — Система учета сотрудников и баллов</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --border-radius: 12px;
            
            /* Цвета должностей */
            --color-chief: #e53e3e;
            --color-deputy: #dd6b20;
            --color-sr-instr: #3182ce;
            --color-instr: #38a169;
            --color-trainee: #718096;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #1a202c;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Форма добавления */
        .form-box {
            background: var(--card-bg);
            padding: 25px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: #4a5568;
        }

        input, select {
            padding: 10px 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border 0.2s;
        }

        input:focus, select:focus {
            border-color: #4299e1;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-add {
            background-color: #3182ce;
            color: white;
            width: 100%;
        }

        .btn-add:hover { background-color: #2b6cb0; }

        /* Список сотрудников */
        .employee-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .employee-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            padding: 20px;
            border-left: 6px solid var(--rank-color, #cbd5e0);
            position: relative;
            transition: transform 0.2s;
        }

        /* Стили границ карточек по рангам */
        .rank-chief { --rank-color: var(--color-chief); }
        .rank-deputy { --rank-color: var(--color-deputy); }
        .rank-sr-instr { --rank-color: var(--color-sr-instr); }
        .rank-instr { --rank-color: var(--color-instr); }
        .rank-trainee { --rank-color: var(--color-trainee); }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .info-block h3 {
            font-size: 1.25rem;
            color: #1a202c;
            margin-bottom: 4px;
        }

        .emp-id-badge {
            font-size: 0.85rem;
            color: #718096;
            font-weight: normal;
            background: #edf2f7;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 5px;
        }

        .rank-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            color: white;
            text-transform: uppercase;
            background-color: var(--rank-color);
        }

        /* Блок баллов */
        .score-box {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #f7fafc;
            padding: 10px 15px;
            border-radius: 8px;
        }

        .score-count {
            font-size: 1.5rem;
            font-weight: 800;
            color: #2d3748;
        }

        /* Кнопки действий */
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.85rem;
            border-radius: 4px;
        }

        .btn-score-up { background-color: #38a169; color: white; }
        .btn-score-up:hover { background-color: #2f855a; }

        .btn-score-down { background-color: #e53e3e; color: white; }
        .btn-score-down:hover { background-color: #c53030; }

        .btn-edit { background-color: #edf2f7; color: #4a5568; }
        .btn-edit:hover { background-color: #e2e8f0; }
        
        .btn-delete { background-color: #fff5f5; color: #e53e3e; border: 1px solid #fed7d7; }
        .btn-delete:hover { background-color: #fed7d7; }

        /* Логи и история */
        .history-box {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #718096;
            border-top: 1px dashed #e2e8f0;
            padding-top: 10px;
        }

        .history-title {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .history-list {
            list-style: none;
            max-height: 80px;
            overflow-y: auto;
        }

        /* Окно выдачи баллов (Модальное меню) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: var(--border-radius);
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .modal h3 { margin-bottom: 15px; }

        .modal-select {
            width: 100%;
            margin-bottom: 20px;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        /* Поля редактирования внутри карточки */
        .edit-fields {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Учет Личного Состава УВД</h1>

    <!-- Форма добавления сотрудника -->
    <div class="form-box">
        <div class="form-grid">
            <div class="form-group">
                <label>ID сотрудника</label>
                <input type="text" id="empId" placeholder="Например: 1024">
            </div>
            <div class="form-group">
                <label>Фамилия</label>
                <input type="text" id="lastName" placeholder="Иванов">
            </div>
            <div class="form-group">
                <label>Имя</label>
                <input type="text" id="firstName" placeholder="Иван">
            </div>
            <div class="form-group">
                <label>Должность / Звание</label>
                <select id="position">
                    <option value="chief">Начальник</option>
                    <option value="deputy">Зам начальника</option>
                    <option value="sr-instr">Старший инструктор</option>
                    <option value="instr">Инструктор</option>
                    <option value="trainee">Стажер</option>
                </select>
            </div>
        </div>
        <button class="btn btn-add" onclick="addEmployee()">➕ Добавить сотрудника</button>
    </div>

    <!-- Список сотрудников -->
    <div class="employee-list" id="employeeList"></div>
</div>

<!-- Модальное окно для начисления баллов -->
<div class="modal" id="scoreModal">
    <div class="modal-content">
        <h3 id="modalEmployeeName">Начислить баллы</h3>
        <div class="form-group">
            <label>Выберите выполненное действие:</label>
            <select id="taskSelect" class="modal-select">
                <option value="10">Проведение собеседования (+10 б.)</option>
                <option value="5">Помощь в собеседовании (+5 б.)</option>
                <option value="15">Проведение лекции (+15 б.)</option>
                <option value="15">Проведение экзамена (+15 б.)</option>
                <option value="10">Принятие присяги (+10 б.)</option>
                <option value="10">Провел экскурсию по УВД (+10 б.)</option>
                <option value="20">Принял экзамен по практике задержания (+20 б.)</option>
            </select>
        </div>
        <div class="modal-buttons">
            <button class="btn btn-edit btn-small" onclick="closeModal()">Отмена</button>
            <button class="btn btn-score-up btn-small" onclick="applyPoints()">Начислить</button>
        </div>
    </div>
</div>

<script>
    // Загрузка массива сотрудников из LocalStorage или создание пустого
    let employees = JSON.parse(localStorage.getItem('uvd_employees')) || [];
    let currentEmployeeId = null;

    // Справка по рангам для сортировки и названий
    const rankConfig = {
        'chief': { order: 1, text: 'Начальник', class: 'rank-chief' },
        'deputy': { order: 2, text: 'Зам начальника', class: 'rank-deputy' },
        'sr-instr': { order: 3, text: 'Старший инструктор', class: 'rank-sr-instr' },
        'instr': { order: 4, text: 'Инструктор', class: 'rank-instr' },
        'trainee': { order: 5, text: 'Стажер', class: 'rank-trainee' }
    };

    // Сохранение данных в память браузера
    function saveData() {
        localStorage.setItem('uvd_employees', JSON.stringify(employees));
    }

    // Функция добавления сотрудника
    function addEmployee() {
        const empId = document.getElementById('empId').value.trim();
        const lastName = document.getElementById('lastName').value.trim();
        const firstName = document.getElementById('firstName').value.trim();
        const position = document.getElementById('position').value;

        if (!empId || !lastName || !firstName) {
            alert('Пожалуйста, заполните все поля (ID, Фамилию и Имя)!');
            return;
        }

        // Проверка на уникальность ID
        const idExists = employees.some(e => e.customId === empId);
        if (idExists) {
            alert('Сотрудник с таким ID уже существует!');
            return;
        }

        const newEmployee = {
            id: Date.now(), // уникальный внутренний ключ для JS
            customId: empId, // пользовательский ID
            lastName: lastName,
            firstName: firstName,
            position: position,
            score: 0,
            history: [],
            isEditing: false
        };

        employees.push(newEmployee);
        
        // Сброс формы
        document.getElementById('empId').value = '';
        document.getElementById('lastName').value = '';
        document.getElementById('firstName').value = '';
        document.getElementById('position').value = 'chief';

        saveData();
        updateUI();
    }

    // Обновление интерфейса (сортировка + отрисовка)
    function updateUI() {
        const listContainer = document.getElementById('employeeList');
        listContainer.innerHTML = '';

        // Автоматическая сортировка по иерархии должностей
        employees.sort((a, b) => rankConfig[a.position].order - rankConfig[b.position].order);

        employees.forEach(emp => {
            const config = rankConfig[emp.position];
            const card = document.createElement('div');
            card.className = `employee-card ${config.class}`;

            if (emp.isEditing) {
                // Если карточка в режиме редактирования
                card.innerHTML = `
                    <div class="edit-fields">
                        <label style="font-size:0.8rem; font-weight:bold;">ID сотрудника:</label>
                        <input type="text" id="editId-${emp.id}" value="${emp.customId || ''}">
                        <label style="font-size:0.8rem; font-weight:bold;">Фамилия:</label>
                        <input type="text" id="editLast-${emp.id}" value="${emp.lastName}">
                        <label style="font-size:0.8rem; font-weight:bold;">Имя:</label>
                        <input type="text" id="editFirst-${emp.id}" value="${emp.firstName}">
                        <label style="font-size:0.8rem; font-weight:bold;">Должность:</label>
                        <select id="editPos-${emp.id}">
                            <option value="chief" ${emp.position === 'chief' ? 'selected' : ''}>Начальник</option>
                            <option value="deputy" ${emp.position === 'deputy' ? 'selected' : ''}>Зам начальника</option>
                            <option value="sr-instr" ${emp.position === 'sr-instr' ? 'selected' : ''}>Старший инструктор</option>
                            <option value="instr" ${emp.position === 'instr' ? 'selected' : ''}>Инструктор</option>
                            <option value="trainee" ${emp.position === 'trainee' ? 'selected' : ''}>Стажер</option>
                        </select>
                    </div>
                    <div class="actions">
                        <button class="btn btn-score-up btn-small" onclick="saveEdit(${emp.id})">💾 Сохранить</button>
                        <button class="btn btn-edit btn-small" onclick="toggleEdit(${emp.id})">Отмена</button>
                    </div>
                `;
            } else {
                // Обычный вид карточки
                let historyHTML = '';
                if (emp.history && emp.history.length > 0) {
                    historyHTML = `
                        <div class="history-box">
                            <div class="history-title">История баллов:</div>
                            <ul class="history-list">
                                ${emp.history.map(item => `<li>• ${item}</li>`).reverse().join('')}
                            </ul>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="card-header">
                        <div class="info-block">
                            <h3><span class="emp-id-badge">ID: ${emp.customId || '—'}</span>${emp.lastName} ${emp.firstName}</h3>
                            <span class="rank-badge">${config.text}</span>
                        </div>
                        <div class="score-box">
                            <span>Баллы:</span>
                            <span class="score-count">${emp.score}</span>
                        </div>
                    </div>
                    ${historyHTML}
                    <div class="actions">
                        <button class="btn btn-score-up btn-small" onclick="openScoreModal(${emp.id})">⭐ Начислить баллы</button>
                        <button class="btn btn-score-down btn-small" onclick="finePoints(${emp.id})">⚠ Списать 5 б.</button>
                        <button class="btn btn-edit btn-small" onclick="toggleEdit(${emp.id})">✏ Редактировать</button>
                        <button class="btn btn-delete btn-small" onclick="deleteEmployee(${emp.id})">🗑 Удалить</button>
                    </div>
                `;
            }

            listContainer.appendChild(card);
        });
    }

    // Функции редактирования
    function toggleEdit(id) {
        const emp = employees.find(e => e.id === id);
        if (emp) {
            emp.isEditing = !emp.isEditing;
            updateUI();
        }
    }

    function saveEdit(id) {
        const emp = employees.find(e => e.id === id);
        if (emp) {
            const newId = document.getElementById(`editId-${id}`).value.trim();
            const newLast = document.getElementById(`editLast-${id}`).value.trim();
            const newFirst = document.getElementById(`editFirst-${id}`).value.trim();
            const newPos = document.getElementById(`editPos-${id}`).value;

            if (!newId || !newLast || !newFirst) {
                alert('Все поля должны быть заполнены!');
                return;
            }

            // Проверка на уникальность ID среди других сотрудников
            const idExists = employees.some(e => e.id !== id && e.customId === newId);
            if (idExists) {
                alert('Этот ID уже занят другим сотрудником!');
                return;
            }

            emp.customId = newId;
            emp.lastName = newLast;
            emp.firstName = newFirst;
            emp.position = newPos;
            emp.isEditing = false;
            
            saveData();
            updateUI();
        }
    }

    // Удаление сотрудника
    function deleteEmployee(id) {
        if (confirm('Вы уверены, что хотите удалить этого сотрудника?')) {
            employees = employees.filter(e => e.id !== id);
            saveData();
            updateUI();
        }
    }

    // Управление модальным окном баллов
    function openScoreModal(id) {
        currentEmployeeId = id;
        const emp = employees.find(e => e.id === id);
        document.getElementById('modalEmployeeName').innerText = `Начисление: [ID: ${emp.customId}] ${emp.lastName} ${emp.firstName}`;
        document.getElementById('scoreModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('scoreModal').style.display = 'none';
        currentEmployeeId = null;
    }

    function applyPoints() {
        if (!currentEmployeeId) return;
        
        const emp = employees.find(e => e.id === currentEmployeeId);
        const taskSelect = document.getElementById('taskSelect');
        const selectedText = taskSelect.options[taskSelect.selectedIndex].text;
        const points = parseInt(taskSelect.value) || 0;

        if (emp) {
            emp.score += points;
            if (!emp.history) emp.history = [];
            emp.history.push(`+${points} б. за: ${selectedText}`);
            
            closeModal();
            saveData();
            updateUI();
        }
    }

    // Ручное быстрое списание (штраф)
    function finePoints(id) {
        const emp = employees.find(e => e.id === id);
        if (emp) {
            emp.score = Math.max(0, emp.score - 5);
            if (!emp.history) emp.history = [];
            emp.history.push(`-5 б. (Взыскание/Корректировка)`);
            
            saveData();
            updateUI();
        }
    }

    // Первичная отрисовка при загрузке страницы
    updateUI();
</script>

</body>
</html>
